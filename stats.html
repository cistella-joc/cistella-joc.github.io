<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cistella! · Estadístiques</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Mateix bosc que el joc: fons de molsa, paper cru, accent rovelló */
  --bosc: #1d2719; --crema: #f7ecd6; --crema-2: #efdcb8; --rovello: #e07a2e; --escorca: #3f2a1d; --molsa: #8fb06e;
  --display: "Gluten", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(ellipse at 50% 0%, #2f4224, #151d12 70%) fixed; background-color: var(--bosc); color: var(--crema); font-family: var(--body); }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 8vw, 44px); margin: 0; line-height: 1; }
h1 span { color: var(--rovello); }
.sub { margin: 0; color: #c9d2b4; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--crema); color: var(--escorca); border-radius: 18px; padding: 12px 14px; }
.tile b { display: block; font-family: var(--display); font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 13px; font-weight: 800; color: #7a6250; }
.tile small { display: block; font-size: 12px; font-weight: 700; color: #4f7d2f; margin-top: 2px; }
.card { background: rgba(247,236,214,.07); border: 1px solid rgba(247,236,214,.14); border-radius: 18px; padding: 14px; }
.card h2 { margin: 0 0 8px; font-size: 16px; font-weight: 800; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.legend { display: flex; gap: 12px; font-size: 13px; font-weight: 700; color: #c9d2b4; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg text { font-family: var(--body); font-size: 11px; fill: #b9c4a4; }
.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid rgba(247,236,214,.1); }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: #c9d2b4; font-weight: 800; }
.msg { color: #c9d2b4; font-weight: 700; }
a { color: #f0b45a; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Cistella<span>!</span> en números</h1>
    <p class="sub" id="sub">Carregant…</p>
  </div>
  <div class="tiles">
    <div class="tile"><b id="tV">–</b><span>visites</span><small id="tV7"></small></div>
    <div class="tile"><b id="tP">–</b><span>partides</span><small id="tP7"></small></div>
    <div class="tile"><b id="tA">–</b><span>partides acabades</span><small id="tA7"></small></div>
    <div class="tile"><b id="tC">–</b><span>cops compartit</span><small id="tC7"></small></div>
  </div>
  <section class="card">
    <h2>Últims 30 dies <span class="legend"><span><i style="background:#8fb06e"></i>Visites</span><span><i style="background:#e07a2e"></i>Partides</span></span></h2>
    <div class="wrap"><svg id="chart" viewBox="0 0 720 240" width="100%" role="img" aria-label="Visites i partides per dia, últims 30 dies"></svg></div>
  </section>
  <section class="card">
    <h2>Dia a dia</h2>
    <div class="wrap"><table><thead><tr><th>Dia</th><th>Visites</th><th>Partides</th><th>Acabades</th><th>Compartit</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <p class="sub">Comptadors anònims: no es guarda cap dada personal. <a href="./">Torna al joc</a></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCrGi81dW1USnsRPlUddDNVPck-zQZxt20",
  authDomain: "cistella-b671a.firebaseapp.com",
  projectId: "cistella-b671a",
  storageBucket: "cistella-b671a.firebasestorage.app",
  messagingSenderId: "204191160309",
  appId: "1:204191160309:web:d932a10754e1334615f2bc"
};
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("ca-ES");
const dayKey = d => { const p = {}; new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Madrid", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d).forEach(x => { p[x.type] = x.value; }); return `${p.year}-${p.month}-${p.day}`; };

async function load() {
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  const snap = await db.collection("stats").get();
  const by = {};
  snap.forEach(d => { if (/^\d{4}-\d{2}-\d{2}$/.test(d.id)) by[d.id] = d.data(); });
  const keys = Object.keys(by).sort();
  const sum = (k, from) => keys.filter(d => !from || d >= from).reduce((a, d) => a + (by[d][k] || 0), 0);
  const d7 = dayKey(new Date(Date.now() - 6 * 864e5));
  [["V", "visites"], ["P", "partides"], ["A", "acabades"], ["C", "compartits"]].forEach(([t, k]) => {
    $("t" + t).textContent = fmt(sum(k));
    $("t" + t + "7").textContent = `${fmt(sum(k, d7))} els últims 7 dies`;
  });
  $("sub").textContent = keys.length ? `Des del ${new Date(keys[0] + "T12:00").toLocaleDateString("ca-ES", { day: "numeric", month: "long", year: "numeric" })}` : "Encara no hi ha dades.";

  // gràfic dels últims 30 dies (barres agrupades)
  const days = [];
  for (let i = 29; i >= 0; i--) days.push(dayKey(new Date(Date.now() - i * 864e5)));
  const vals = days.map(d => [by[d]?.visites || 0, by[d]?.partides || 0]);
  const max = Math.max(1, ...vals.flat());
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return [1, 2, 5, 10].map(m => m * p).find(v => v >= max); })();
  const W = 720, H = 240, L = 40, B = 26, T = 10, cw = (W - L - 8) / days.length, bw = Math.max(2, cw * .36);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, y = H - B - (H - B - T) * i / 4; g += `<line x1="${L}" x2="${W - 4}" y1="${y}" y2="${y}" stroke="rgba(247,236,214,.1)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  days.forEach((d, i) => {
    const x = L + i * cw + cw / 2, [v, p] = vals[i], h = n => (H - B - T) * n / nice;
    g += `<rect x="${x - bw - 1}" y="${H - B - h(v)}" width="${bw}" height="${h(v)}" rx="2" fill="#8fb06e"><title>${d}: ${v} visites</title></rect>`;
    g += `<rect x="${x + 1}" y="${H - B - h(p)}" width="${bw}" height="${h(p)}" rx="2" fill="#e07a2e"><title>${d}: ${p} partides</title></rect>`;
    if (i % 5 === 4 || i === 0) g += `<text x="${x}" y="${H - 8}" text-anchor="middle">${+d.slice(8)}/${+d.slice(5, 7)}</text>`;
  });
  $("chart").innerHTML = g;

  $("rows").innerHTML = keys.slice().reverse().map(d => { const r = by[d];
    return `<tr><td>${new Date(d + "T12:00").toLocaleDateString("ca-ES", { weekday: "short", day: "numeric", month: "short" })}</td><td>${fmt(r.visites || 0)}</td><td>${fmt(r.partides || 0)}</td><td>${fmt(r.acabades || 0)}</td><td>${fmt(r.compartits || 0)}</td></tr>`; }).join("")
    || `<tr><td colspan="5" class="msg">Encara no hi ha dades.</td></tr>`;
}
load().catch(() => { $("sub").textContent = "No s'han pogut carregar les dades. Comprova la connexió i les regles de Firebase."; });
</script>
</body>
</html>
